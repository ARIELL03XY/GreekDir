name: Release

# Pushing a tag such as v1.0.0 (or v1.0.0-beta.1, marked as a pre-release) builds the Windows installer and creates a DRAFT GitHub release with
# the installer, its SHA-256 and that version's section of CHANGELOG.md as release notes. Nothing is published until you review the
# draft and click "Publish". The tag must match package.json and CHANGELOG.md must have a "## [version]" section.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: Build and draft release
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: The tag must match package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # Written by node itself (UTF-8), not through a PowerShell pipe that could re-encode it.
          node scripts/changelog.mjs notes $env:GITHUB_REF_NAME "$env:RUNNER_TEMP/CHANGES.md"
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md has no section for $env:GITHUB_REF_NAME" }
          Get-Content "$env:RUNNER_TEMP/CHANGES.md" -Encoding utf8

      - run: npm test
      - run: npm run build:win

      - name: Checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/GreekDir-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $changes = Get-Content "$env:RUNNER_TEMP/CHANGES.md" -Raw -Encoding utf8
          $notes = @"
          $changes

          ## Verify your download

          This build is **not code-signed yet**, so Windows SmartScreen may warn about an unknown publisher.
          Compare the SHA-256 of the installer with ``SHA256SUMS.txt`` before running it:

          ``Get-FileHash .\GreekDir-Setup-*.exe -Algorithm SHA256``

          The installer lets you install GreekDir or run it once without installing.
          "@
          # A tag like v1.0.0-beta.1 is marked as a pre-release.
          $flags = @()
          if ($env:GITHUB_REF_NAME -match '-') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME --draft @flags --verify-tag --title "GreekDir $env:GITHUB_REF_NAME" --notes $notes `
            (Get-ChildItem release/GreekDir-Setup-*.exe).FullName release/SHA256SUMS.txt
