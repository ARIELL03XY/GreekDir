name: Release

# Pushing a tag such as v1.0.0 (or v1.0.0-beta.2, marked as a pre-release) builds the Windows installer and the macOS DMGs
# (Apple Silicon and Intel) and creates a DRAFT GitHub release with them, SHA256SUMS.txt and that version's section of
# CHANGELOG.md as release notes. Nothing is published until you review the draft and click "Publish".
# The tag must match package.json and CHANGELOG.md must have a "## [version]" section; both are checked before building.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  prepare:
    name: Check tag and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag must match package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          node scripts/changelog.mjs notes "$GITHUB_REF_NAME" CHANGES.md
          cat >> CHANGES.md <<'EOF'

          ## Verify your download

          These builds are **not code-signed yet**. Compare the SHA-256 of what you downloaded with `SHA256SUMS.txt` before opening it:

          - Windows (PowerShell): `Get-FileHash .\GreekDir-Setup-*.exe -Algorithm SHA256`
          - macOS (Terminal): `shasum -a 256 ~/Downloads/GreekDir-*.dmg`

          **Windows:** SmartScreen may warn about an unknown publisher. The installer lets you install GreekDir or run it once without installing.

          **macOS:** download the DMG for your Mac (`arm64` = Apple Silicon M1 or later, `x64` = Intel), drag GreekDir to Applications and open it. macOS will say it cannot verify the developer: open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. To scan protected folders (Documents, Desktop, Mail…), turn on **Full Disk Access** for GreekDir in the same settings page.
          EOF
          cat CHANGES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: CHANGES.md
          if-no-files-found: error

  windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: release/GreekDir-Setup-*.exe
          if-no-files-found: error

  macos:
    name: Build macOS DMGs
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:mac
      - name: Signature check
        run: |
          for app in release/mac-arm64/GreekDir.app release/mac/GreekDir.app; do
            codesign --verify --deep --strict "$app"
          done
      - name: Smoke test (Apple Silicon build)
        run: node scripts/smoke-test.mjs release/mac-arm64/GreekDir.app/Contents/MacOS/GreekDir smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: release/*.dmg
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum GreekDir-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          # A tag like v1.0.0-beta.2 is marked as a pre-release.
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft "${flags[@]}" --verify-tag \
            --title "GreekDir $GITHUB_REF_NAME" --notes-file CHANGES.md \
            GreekDir-* SHA256SUMS.txt
