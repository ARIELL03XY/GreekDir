version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Large migrations that are not security fixes: do them deliberately in their own change
      # (Tailwind 4 rewrites the config and CSS entry point; ESLint 10 drops the legacy .eslintrc).
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for routine dev-tooling updates; runtime dependencies and Electron get their own PRs.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: [electron]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
