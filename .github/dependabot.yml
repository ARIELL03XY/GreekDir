version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-tooling updates; runtime dependencies and Electron get their own PRs.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: [electron]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
